<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Switchyard</title>
  <link rel="icon" href="icons/icon-32.png">
  <link rel="stylesheet" href="style.css">
  <style>
    body { min-height: 100vh; display: grid; place-items: center; }
    main { width: 420px; padding: 32px; text-align: center; }
    main > img { width: 96px; height: 96px; }
    h1 { font-size: 20px; margin: 12px 0 6px; }
    .row { justify-content: center; }
  </style>
</head>
<body>
  <main>
    <img src="icons/icon-128.png" alt="">
    <h1><span id="dot" class="dot"></span><span id="status">Connecting…</span></h1>
    <p id="detail" class="muted"></p>
    <p class="muted">Pin Switchyard from the puzzle-piece menu in the toolbar to see its status and send pages to it. You can close this tab.</p>
    <section id="page" hidden><p id="verdict"></p><button id="send"></button></section>
    <div class="row"><button id="reconnect">Reconnect</button></div>
  </main>
  <script src="match.js"></script>
  <script src="popup.js"></script>
</body>
</html>
